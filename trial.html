<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desktop Navbar</title>
  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="navbar.css" />
  <link rel="stylesheet" href="banner.css" />
  <link rel="stylesheet" href="future exhibitions.css"
  <link
    href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
    rel="stylesheet"
  />
</head>
<body>
<nav class="navbar">
  <div class="nav-left">
    <a href="#home" class="nav-link">
      <img src="kings logo.png" alt="Logo" class="logo">
    </a>
  </div>
  <div class="nav-center">
    <a href="#store" class="nav-link">STORE</a>
    <a href="#exhibitions" class="nav-link">EXHIBITIONS</a>
    <a href="#apply" class="nav-link">APPLY</a>
    <a href="#about" class="nav-link">ABOUT</a>
  </div>
  <div class="nav-right">
    <a href="#cart" class="nav-link">
      <img src="cart.png" alt="Cart" class="cart-icon">
    </a>
  </div>
</nav>
<section class="banner">
  <div class="banner-text">
    <a href="#current-exhibition" class="nav-link">Current Exhibition</a>
  </div>
</section>
<section class="future-exhibition">
  <div class="center-text">Future Exhibitions</div>
  <div class="floating-images">
    <img src="image1.jpg" alt="Image 1" />
    <img src="image2.jpg" alt="Image 2" />
    <img src="image3.jpg" alt="Image 3" />
    <img src="image4.jpg" alt="Image 4" />
  </div>
</section>

</body>
</html>
