<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desktop Navbar</title>
  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="navbar.css" />
  <link rel="stylesheet" href="banner.css" />
  <link rel="stylesheet" href="future exhibitions.css"
    href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
    rel="stylesheet"
  />
</head>
<body>
<nav class="navbar">
  <div class="nav-left">
    <a href="#home" class="nav-link">
      <img src="kings logo.png" alt="Logo" class="logo">
    </a>
  </div>
  <div class="nav-center">
    <a href="#store" class="nav-link">STORE</a>
    <a href="#exhibitions" class="nav-link">EXHIBITIONS</a>
    <a href="#apply" class="nav-link">APPLY</a>
    <a href="#about" class="nav-link">ABOUT</a>
  </div>
  <div class="nav-right">
    <a href="#cart" class="nav-link">
      <img src="cart.png" alt="Cart" class="cart-icon">
    </a>
  </div>
</nav>
<section class="banner">
  <div class="banner-text">Current Exhibition</div>  
  <div class="banner-img">
  <img src="Japanese.jpg" alt="japanese art" />
  </div>
  <div class="banner-caption">
    <div class="artist">Hokusai</div>
    <div class="exhibition">Waves of Legacy</div>
</div>
</section>
<section class="future-exhibition">
  <div class="center-text">Future Exhibitions</div>
<div class="floating-images">

<div class="image-container img1">
  <img src="cubism.jpg" alt="cubism" />
  <span class="caption">
    <span class="artist">Pablow Pikarseau</span><br />
    <span class="exhibition">Fragmentation In Dimensions</span>
  </span>
</div>

<div class="image-container img2">
  <img src="impressionism.jpg" alt="impressionism" />
  <span class="caption">
    <span class="artist">Clord Monaye</span><br />
    <span class="exhibition">Dreamscapes</span>
  </span>
</div>

<div class="image-container img3">
  <img src="surrealism.jpg" alt="surrealism" />
  <span class="caption">
    <span class="artist">Selvidawe Dhaalie</span><br />
    <span class="exhibition">Surrealist Realities</span>
  </span>
</div>

<div class="image-container img4">
  <img src="realism.jpg" alt="realism" />
  <span class="caption">
    <span class="artist">Goostharv Corbay</span><br />
    <span class="exhibition">Seen Life</span>
  </span>
</div>
</div>
</section>

</body>
</html>
