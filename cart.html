<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart – Kings Artist Run</title>
  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="navbar.css" />
  <link rel="stylesheet" href="footer.css" />
  <link rel="stylesheet" href="cart.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="nav-link">
        <img src="kings logo.png" alt="Logo" class="logo" />
      </a>
    </div>
    <div class="nav-center">
      <button class="menu-toggle" aria-label="Toggle menu">☰</button>
      <div class="nav-links">
        <a href="store.html" class="nav-link">STORE</a>
        <a href="#exhibitions" class="nav-link">EXHIBITIONS</a>
        <a href="#apply" class="nav-link">APPLY</a>
        <a href="#about" class="nav-link">ABOUT</a>
      </div>
    </div>
    <div class="nav-right">
      <a href="cart.html" class="nav-link">
        <img src="cart.png" alt="Cart" class="cart-icon" />
      </a>
    </div>
  </nav>

  <!-- CART SECTION -->
  <section class="cart-page">

    <!-- LEFT: Input fields -->
    <div class="cart-left">

      <a href="store.html" class="return-link">
        <img src="back.png" alt="Back" class="return-icon" /> Return to Store
      </a>

      <!-- Delivery Info Dropdown -->
      <div class="info-section">
        <button class="info-toggle" aria-expanded="false">
          Delivery Information ▼
        </button>
        <div class="info-content">
          <input type="text" placeholder="Full Name" required />
          <input type="text" placeholder="Address" required />
          <input type="text" placeholder="City" required />
          <input type="text" placeholder="Postcode" required />
          <input type="email" placeholder="Email Address" required />
        </div>
      </div>

      <!-- Payment Details Dropdown -->
      <div class="info-section">
        <button class="info-toggle" aria-expanded="false">
          Payment Details ▼
        </button>
        <div class="info-content">
          <input type="text" placeholder="Card Number" required />
          <input type="text" placeholder="Expiry Date (MM/YY)" required />
          <input type="text" placeholder="CVV" required />
        </div>
      </div>

      <a href="confirmation.html" class="purchase-button">Purchase</a>
    </div>

    <!-- Vertical Divider -->
    <div class="divider"></div>

    <!-- RIGHT: Cart summary -->
    <div class="cart-right">
      <div class="cart-item">
        <img src="Store/fractured.jpg" alt="Fractured" />
        <div class="item-info">
          <div class="item-name">Fractured</div>
          <div class="item-artist">by Chloe Hart</div>
        </div>
        <div class="item-price">$180.00 AUD</div>
      </div>

      <hr class="total-divider" />

      <div class="cart-total">
        <span>Total:</span>
        <strong>$180.00 AUD</strong>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-section">
      <h4>LOCATION</h4>
      <p>69 Capel Street</p>
      <p>West Melbourne 3003</p>
    </div>
    <div class="footer-section">
      <h4>CONTACT</h4>
      <p>info@kingsartistrun.org.au</p>
    </div>
    <div class="footer-section">
      <h4>OPENING HOURS</h4>
      <p>Thursday to Sunday</p>
      <p>12:00 PM to 5:00 PM</p>
    </div>
    <div class="footer-section logos">
      <img src="insta.png" alt="Instagram" />
      <img src="fb.png" alt="Facebook" />
      <img src="tiktok.png" alt="TikTok" />
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
</body>
</html>
